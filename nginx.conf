# Teste A/B da LP: cada visitante cai em A ou B (50/50) e fica na mesma variante pelo cookie lobs_v.
# ?v=a ou ?v=b força a variante (para conferir as duas).
split_clients "${remote_addr}${http_user_agent}${request_id}" $lobs_sorteio { 50% a; * b; }
map $arg_v $lobs_v_arg { a a; b b; default ""; }
map $cookie_lobs_v $lobs_v_cookie { a a; b b; default ""; }
map "$lobs_v_arg:$lobs_v_cookie" $lobs_v {
  ~^(?<x>[ab]):  $x;
  ~^:(?<y>[ab])$ $y;
  default        $lobs_sorteio;
}
map $lobs_v $lobs_pagina { b /b/index.html; default /index.html; }

server {
  listen 80;
  server_name www.lobsbot.com.br;
  return 301 https://lobsbot.com.br$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  include /etc/nginx/conf.d/lobs-headers.inc;

  location /_astro/ { expires 1y; }
  location /fonts/ { expires 1y; }
  location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }
  # A raiz serve a variante sorteada. add_header aqui substitui os do server, por isso o include se repete.
  location = / {
    include /etc/nginx/conf.d/lobs-headers.inc;
    add_header Set-Cookie "lobs_v=$lobs_v; Path=/; Max-Age=7776000; SameSite=Lax; Secure" always;
    add_header Cache-Control "no-store" always;
    add_header Vary "Cookie" always;
    try_files $lobs_pagina =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
